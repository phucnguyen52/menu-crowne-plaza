<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Number Generator</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url('background.png') no-repeat center center fixed; /* Đặt nền từ file background.png */
      background-size: cover;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
    .card {
      padding: 20px;
      margin: 20px;
      border: unset;
      background: unset;
      position: relative;
      z-index: 2;
    }
    .number-display {
      font-size: 10em;
      font-weight: bold;
      color: yellow;
      text-align: center;
    }
    .spinner {
      display: none;
      font-size: 1em;
      color: white;
    }
    #fireworks {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    .hidden {
      display: none;
    }
     #chucmung {
      display: none;
      font-size: 3em;
      font-weight: bold;
      color: yellow;
      text-align: center;
      margin: 20px 0px 0px 0px;
      min-height: 1.2em;
    }

    #generateButton {
      width:fit-content;
      margin:auto;
      padding:10px 30px;
      background: red;
      border: 3px solid white;
    }
  </style>
</head>
<body>
  <canvas id="fireworks"></canvas>

  <div class="card text-center">
    <div class="settings-container">
      <form id="randomForm">
        <div class="row g-3">
          <div class="col-md-5">
            <input type="number" id="min" class="form-control" placeholder="Min" required>
          </div>
          <div class="col-md-5">
            <input type="number" id="max" class="form-control" placeholder="Max" required>
          </div>
          <div class="col-md-2">
            <select id="time" class="form-control" required>
              <option value="1">1 giây</option>
              <option value="3">3 giây</option>
              <option value="5">5 giây</option>
              <option value="10">10 giây</option>
              <option value="20">20 giây</option>
              <option value="30">30 giây</option>
            </select>
          </div>
        </div>
      </form>
    </div>
    <div id="chucmung" class="hidden">🎉 Xin Chúc Mừng:</div>
    <div class="number-display" id="numberDisplay"></div>
    <div class="spinner" id="spinner">⏳ Đang Quay Số...</div>
    <button type="button" class="btn btn-primary mt-3" id="generateButton" onclick="startCountdown()">Tạo số ngẫu nhiên</button>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  <audio id="celebrationAudio" src="fanfare-winner.mp3" preload="auto"></audio>

  <!-- Fireworks.js -->
  <script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.x/dist/index.umd.js"></script>

  <script>
    const fireworksCanvas = document.getElementById('fireworks');
    const fireworks = new Fireworks.default(fireworksCanvas, {
      maxRockets: 10,
      rocketSpawnInterval: 150,
      numParticles: 100,
      explosionMinHeight: 0.1,
      explosionMaxHeight: 0.5,
      explosionChance: 0.2,
      gravity: 0.2,
      friction: 0.98,
      particleSpeed: 3,
    });

    let previousNumbers = []; // Mảng lưu trữ các số đã quay
    let settingsHidden = false; // Trạng thái hiển thị của settings

    function startCountdown() {
      document.getElementById('chucmung').style.display = "none";
      const min = parseInt(document.getElementById('min').value);
      const max = parseInt(document.getElementById('max').value);
      const time = parseInt(document.getElementById('time').value);
      const display = document.getElementById('numberDisplay');
      const spinner = document.getElementById('spinner');
      const celebrationAudio = document.getElementById('celebrationAudio');
      const settingsContainer = document.querySelector('.settings-container');

      if (!settingsHidden) {
        if (isNaN(min) || isNaN(max) || min >= max) {
          display.innerText = "❌ Vui lòng nhập khoảng số hợp lệ!";
          return;
        }

        // Ẩn phần setting
        settingsContainer.classList.add('hidden');
        settingsHidden = true;
      }

      // Đặt lại danh sách số đã quay nếu toàn bộ số đã được sử dụng
      if (previousNumbers.length >= (max - min + 1)) {
        previousNumbers = [];
      }

      spinner.style.display = "block";
      display.innerText = "";

      let interval = setInterval(() => {
        let randomNumber;
        do {
          randomNumber = Math.floor(Math.random() * (max - min + 1)) + min;
        } while (previousNumbers.includes(randomNumber)); // Kiểm tra trùng lặp

        display.innerText = randomNumber;
      }, 100);

      setTimeout(() => {
        clearInterval(interval);

        let finalNumber;
        do {
          finalNumber = Math.floor(Math.random() * (max - min + 1)) + min;
        } while (previousNumbers.includes(finalNumber)); // Kiểm tra trùng lặp

        previousNumbers.push(finalNumber); // Lưu số đã quay
        celebrationAudio.play();

        display.innerText = `${finalNumber}`;
        spinner.style.display = "none";
        fireworks.start();
        document.getElementById('chucmung').style.display = "block";
        setTimeout(() => {
          fireworks.stop();
        }, 5000);
      }, time * 1000);
    }
  </script>
</body>
</html>
