
<!DOCTYPE html>

<style>
    .image-grid {
        display: flex;
        flex-wrap:wrap;
        justify-content: space-between;
        align-items:center
    }

    .image-grid a {
        width: 100%;
        padding: 0px;
        box-sizing: border-box;
        display: flex;
        flex-wrap:wrap;
        justify-content: center;
        align-items:center
    }

    .image-grid img {
        width: 50%;
        height: auto;
        display: block;
    }

    @media (max-width: 600px) {
        .image-grid a {
            width: 100%;
        }
        .image-grid img {
            width: 100%;
        }
    }
</style>


</head>

</div>
